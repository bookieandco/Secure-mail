services:
  demo-site:
    build:
      context: ./demo-site
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - '8080'
    networks:
      - web_edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  ferron:
    image: ferronserver/ferron:latest
    restart: 'no'
    depends_on:
      demo-site:
        condition: service_healthy
    ports:
      - '8080:8080'
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - web_edge

networks:
  web_edge:
    driver: bridge
    internal: false
